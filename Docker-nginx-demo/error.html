<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1026">
  <title>Page Not Found | SkyHost</title>
  <style>
    :root { color-scheme: dark; --bg:#080d20; --panel:rgba(20,29,63,.72); --text:#f7f8ff; --muted:#aab5d6; --blue:#4f8cff; --violet:#8b5cf6; }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; padding:28px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(ellipse at 18% 15%,rgba(49,91,205,.27),transparent 36%),radial-gradient(ellipse at 85% 78%,rgba(139,92,246,.24),transparent 35%),var(--bg); }
    body::before, body::after { content:""; position:fixed; width:300px; height:300px; border:1px solid rgba(142,174,255,.12); border-radius:50%; pointer-events:none; }
    body::before { top:-160px; right:10%; box-shadow:0 0 0 35px rgba(142,174,255,.025),0 0 0 70px rgba(142,174,255,.02); }
    body::after { bottom:-190px; left:8%; width:380px; height:380px; box-shadow:0 0 0 35px rgba(142,174,255,.025),0 0 0 70px rgba(142,174,255,.02); }
    .wrap { width:min(100%,720px); position:relative; z-index:1; text-align:center; padding:clamp(28px,6vw,60px); border:1px solid rgba(177,195,255,.16); border-radius:30px; background:linear-gradient(145deg,rgba(25,37,79,.78),rgba(13,19,43,.78)); box-shadow:0 30px 100px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(18px); }
    .brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:30px; color:#f5f7ff; font-size:1rem; font-weight:750; letter-spacing:.02em; text-decoration:none; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#35b7ff,#5556f6); box-shadow:0 8px 24px rgba(66,119,255,.3); }
    .brand-mark svg { width:21px; height:21px; }
    .illustration { position:relative; width:190px; height:145px; margin:0 auto 12px; display:grid; place-items:center; }
    .orbit { position:absolute; inset:8px 18px; border:1px dashed rgba(137,171,255,.45); border-radius:50%; animation:spin 24s linear infinite; }
    .planet { position:relative; width:108px; height:108px; display:grid; place-items:center; border-radius:32px; transform:rotate(-8deg); background:linear-gradient(145deg,#386fff,#8557f7); box-shadow:0 18px 45px rgba(67,91,255,.35),inset 0 1px 0 rgba(255,255,255,.3); }
    .planet svg { width:60px; height:60px; transform:rotate(8deg); }
    .float { position:absolute; display:grid; place-items:center; width:38px; height:38px; border-radius:13px; background:#17264f; border:1px solid rgba(160,185,255,.24); color:#8fc8ff; box-shadow:0 10px 25px rgba(0,0,0,.25); font-size:20px; }
    .float.one { top:12px; right:17px; } .float.two { bottom:8px; left:12px; color:#c3a6ff; }
    .eyebrow { margin:10px 0 8px; color:#8eb7ff; font-size:.76rem; font-weight:800; text-transform:uppercase; letter-spacing:.2em; }
    h1 { margin:0; font-size:clamp(2.25rem,7vw,4.1rem); line-height:1.04; letter-spacing:-.055em; }
    h1 span { display:block; color:#92aaff; }
    .code { margin:18px 0 10px; color:rgba(183,198,255,.23); font-size:clamp(4rem,13vw,7rem); font-weight:900; letter-spacing:.04em; line-height:.95; }
    .message { max-width:440px; margin:16px auto 28px; color:var(--muted); font-size:1rem; line-height:1.75; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:49px; padding:0 22px; border-radius:14px; font:inherit; font-size:.94rem; font-weight:750; text-decoration:none; transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease; }
    .btn:hover { transform:translateY(-3px); }
    .btn:focus-visible { outline:3px solid #a7c5ff; outline-offset:4px; }
    .primary { color:white; background:linear-gradient(100deg,#397bff,#7357f5); box-shadow:0 12px 28px rgba(69,100,255,.27); }
    .primary:hover { box-shadow:0 16px 34px rgba(69,100,255,.4); }
    .secondary { color:#e5eaff; border:1px solid rgba(178,195,255,.25); background:rgba(255,255,255,.035); }
    .secondary:hover { border-color:rgba(178,195,255,.55); }
    .hint { margin-top:28px; color:#7482aa; font-size:.8rem; }
    .hint a { color:#a8bdff; text-underline-offset:3px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:480px) { body { padding:14px; } .wrap { border-radius:24px; padding:28px 20px 26px; } .brand { margin-bottom:20px; } .illustration { transform:scale(.9); margin-bottom:0; } .btn { width:100%; } .message { font-size:.94rem; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="page-title">
    <a class="brand" href="./index.html" aria-label="SkyHost home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7.2 18.5h10.1a4.2 4.2 0 0 0 .5-8.37A6.1 6.1 0 0 0 6.1 8.6a4.98 4.98 0 0 0 1.1 9.9Z" fill="white"/></svg></span>
      <span>SkyHost</span>
    </a>

    <div class="illustration" aria-hidden="true">
      <div class="orbit"></div>
      <div class="planet"><svg viewBox="0 0 64 64" fill="none"><path d="M18 45h28a11 11 0 0 0 1.3-21.92A16.5 16.5 0 0 0 15.4 20.5 12.3 12.3 0 0 0 18 45Z" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m26 32 5 5 10-11" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="float one">✦</span><span class="float two">⌁</span>
    </div>

    <p class="eyebrow">Oops! You took a wrong turn</p>
    <div class="code" aria-hidden="true">404</div>
    <h1 id="page-title">Page not <span>found.</span></h1>
    <p class="message">Looks like this page has drifted into the cloud. The link may be broken, or the page may have moved. Let's get you back on track.</p>

    <div class="actions">
      <a class="btn primary" href="./index.html" aria-label="Go to home page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Go to Home Page
      </a>
      <a class="btn secondary" href="javascript:history.back()" onclick="if (history.length <= 1) { window.location.href='./index.html'; return false; }">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Go Back
      </a>
    </div>
    <p class="hint">Need a fresh start? <a href="./index.html">Visit our homepage</a>.</p>
  </main>
</body>
</html>
